name: Publish Cyber Incident Explorer to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package v0.5.27 source with license
        run: |
          mkdir -p _site
          base64 --decode cyber-incident-explorer-v0.5.27.zip.b64 > /tmp/cyber-incident-explorer-v0.5.27.zip
          unzip -q /tmp/cyber-incident-explorer-v0.5.27.zip -d _site
          cp LICENSE CONTRIBUTING.md _site/
          (cd _site && zip -q -FS cyber-incident-explorer-v0.5.27.zip index.html README.md QA-REPORT.md LICENSE CONTRIBUTING.md)
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
